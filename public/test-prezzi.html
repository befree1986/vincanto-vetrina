<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Prezzi Vincanto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 15px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #1d4ed8; }
        .result { margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 5px; border-left: 4px solid #2563eb; }
        .error { background: #fee; border-left-color: #dc3545; }
        .success { background: #f0f9f0; border-left-color: #28a745; }
        .debug { font-family: monospace; background: #f8f9fa; padding: 10px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧮 Test Calcolo Prezzi Vincanto</h1>
        <p>Verifica se il sistema calcola correttamente <strong>€75 per persona per notte</strong></p>
        
        <form id="priceTest">
            <div class="form-group">
                <label for="checkIn">Data Check-in:</label>
                <input type="date" id="checkIn" required>
            </div>
            
            <div class="form-group">
                <label for="checkOut">Data Check-out:</label>
                <input type="date" id="checkOut" required>
            </div>
            
            <div class="form-group">
                <label for="guests">Numero Ospiti:</label>
                <select id="guests" required>
                    <option value="">Seleziona ospiti</option>
                    <option value="1">1 persona</option>
                    <option value="2">2 persone</option>
                    <option value="3">3 persone</option>
                    <option value="4">4 persone</option>
                    <option value="5">5 persone</option>
                    <option value="6">6 persone</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="parking">Parcheggio:</label>
                <select id="parking">
                    <option value="false">No</option>
                    <option value="true">Sì</option>
                </select>
            </div>
            
            <button type="submit">🧮 Calcola Prezzo</button>
        </form>
        
        <div id="result"></div>
    </div>

    <script>
        // Set default dates (today + 7 days for check-in, +9 days for check-out)
        const today = new Date();
        const checkInDate = new Date(today);
        checkInDate.setDate(today.getDate() + 7);
        const checkOutDate = new Date(today);
        checkOutDate.setDate(today.getDate() + 9);
        
        document.getElementById('checkIn').value = checkInDate.toISOString().split('T')[0];
        document.getElementById('checkOut').value = checkOutDate.toISOString().split('T')[0];
        document.getElementById('guests').value = '2';

        document.getElementById('priceTest').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const checkIn = document.getElementById('checkIn').value;
            const checkOut = document.getElementById('checkOut').value;
            const guests = document.getElementById('guests').value;
            const includeParking = document.getElementById('parking').value === 'true';
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>🔄 Caricamento calcolo prezzi...</p>';
            
            try {
                // Calculate nights
                const nights = Math.ceil((new Date(checkOut) - new Date(checkIn)) / (1000 * 60 * 60 * 24));
                
                console.log('📝 PARAMETRI TEST:', { checkIn, checkOut, guests, nights, includeParking });
                
                // Call API
                const response = await fetch(`/api/quote?checkIn=${checkIn}&checkOut=${checkOut}&guests=${guests}&includeParking=${includeParking}`);
                const data = await response.json();
                
                console.log('📊 RISPOSTA API:', data);
                
                if (data.success) {
                    const costs = data.costs;
                    const expectedBase = nights * parseInt(guests) * 75; // €75 per persona per notte
                    const isCorrect = Math.abs(costs.basePrice - expectedBase) < 1;
                    
                    resultDiv.innerHTML = `
                        <div class="result ${isCorrect ? 'success' : 'error'}">
                            <h3>${isCorrect ? '✅' : '❌'} Risultato Test Prezzi</h3>
                            
                            <div class="debug">
                                <strong>📋 Parametri:</strong><br>
                                Check-in: ${checkIn}<br>
                                Check-out: ${checkOut}<br>
                                Ospiti: ${guests} persone<br>
                                Notti: ${nights}<br>
                                Parcheggio: ${includeParking ? 'Sì' : 'No'}
                            </div>
                            
                            <div class="debug">
                                <strong>🧮 Calcolo Atteso vs Effettivo:</strong><br>
                                Formula Attesa: ${nights} notti × ${guests} persone × €75 = €${expectedBase}<br>
                                Calcolo API: €${costs.basePrice}<br>
                                <strong style="color: ${isCorrect ? 'green' : 'red'}">
                                    ${isCorrect ? '✅ CORRETTO!' : '❌ ERRORE!'}
                                </strong>
                            </div>
                            
                            <div class="debug">
                                <strong>💰 Dettaglio Costi:</strong><br>
                                Base (${costs.breakdown?.pricePerPersonPerNight || 'N/A'}€/persona/notte): €${costs.basePrice}<br>
                                Pulizia finale: €${costs.cleaningFee}<br>
                                Parcheggio: €${costs.parkingCost}<br>
                                Tassa soggiorno: €${costs.touristTax}<br>
                                <strong>Totale: €${costs.totalAmount}</strong>
                            </div>
                            
                            <div class="debug">
                                <strong>🔍 Breakdown Dettagliato:</strong><br>
                                ${JSON.stringify(costs.breakdown || {}, null, 2)}
                            </div>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <h3>❌ Errore API</h3>
                            <p><strong>Errore:</strong> ${data.error || 'Errore sconosciuto'}</p>
                            <div class="debug">${JSON.stringify(data, null, 2)}</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('❌ Errore test:', error);
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Errore di Connessione</h3>
                        <p><strong>Errore:</strong> ${error.message}</p>
                        <p>Verifica che l'API sia attiva e accessibile.</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
