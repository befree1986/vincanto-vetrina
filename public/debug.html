<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Booking System</title>
</head>
<body>
    <h1>🔍 Booking System Debug</h1>
    
    <div id="debug-output"></div>
    
    <script>
        const output = document.getElementById('debug-output');
        
        async function testBookingSystem() {
            output.innerHTML += '<h2>1. Test API Extra Services</h2>';
            
            try {
                const response = await fetch('/api/unified?action=extra-services');
                const data = await response.json();
                
                output.innerHTML += `<p>✅ API Response: ${JSON.stringify(data, null, 2)}</p>`;
                
                // Trova la culla
                const culla = data.services?.find(s => s.name && s.name.includes('Culla'));
                if (culla) {
                    output.innerHTML += `<p>🛏️ Culla trovata: Category = ${culla.category}, MinAge = ${culla.minAge}, MaxAge = ${culla.maxAge}</p>`;
                } else {
                    output.innerHTML += '<p>❌ Culla NON trovata!</p>';
                }
                
            } catch (error) {
                output.innerHTML += `<p>❌ Errore API: ${error.message}</p>`;
            }
            
            output.innerHTML += '<h2>2. Test URL attuale</h2>';
            output.innerHTML += `<p>URL: ${window.location.href}</p>`;
            output.innerHTML += `<p>Timestamp: ${new Date().toISOString()}</p>`;
            
            output.innerHTML += '<h2>3. Test localStorage</h2>';
            try {
                localStorage.setItem('debug-test', Date.now().toString());
                const test = localStorage.getItem('debug-test');
                output.innerHTML += `<p>✅ localStorage funziona: ${test}</p>`;
            } catch (e) {
                output.innerHTML += `<p>❌ localStorage errore: ${e.message}</p>`;
            }
        }
        
        // Esegui test al caricamento
        window.addEventListener('load', testBookingSystem);
    </script>
</body>
</html>
