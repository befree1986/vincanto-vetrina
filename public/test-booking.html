<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Booking System - Vincanto</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        h1 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .result.success {
            background: #f0fdf4;
            border: 2px solid #86efac;
            color: #166534;
        }
        .result.error {
            background: #fef2f2;
            border: 2px solid #fca5a5;
            color: #991b1b;
        }
        .result.show { display: block; }
        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        pre {
            background: #f7fafc;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Booking System</h1>
        <p class="subtitle">Verifica funzionalità frontend → API → database</p>
        
        <form id="bookingForm">
            <div class="row">
                <div class="form-group">
                    <label>Check-in</label>
                    <input type="date" id="checkin" required>
                </div>
                <div class="form-group">
                    <label>Check-out</label>
                    <input type="date" id="checkout" required>
                </div>
            </div>
            
            <div class="row">
                <div class="form-group">
                    <label>Adulti</label>
                    <input type="number" id="adults" min="1" max="8" value="2" required>
                </div>
                <div class="form-group">
                    <label>Bambini</label>
                    <input type="number" id="children" min="0" max="4" value="0">
                </div>
            </div>
            
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="customerName" placeholder="Mario Rossi" required>
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="customerEmail" placeholder="mario.rossi@example.com" required>
            </div>
            
            <div class="form-group">
                <label>Telefono</label>
                <input type="tel" id="customerPhone" placeholder="+39 333 1234567" required>
            </div>
            
            <div class="form-group">
                <label>Note (opzionale)</label>
                <textarea id="specialRequests" rows="3" placeholder="Richieste speciali..."></textarea>
            </div>
            
            <button type="submit" id="submitBtn">
                Invia Prenotazione Test
            </button>
        </form>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        // Imposta date di default (domani + 3 giorni)
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        const checkout = new Date(tomorrow);
        checkout.setDate(checkout.getDate() + 3);
        
        document.getElementById('checkin').valueAsDate = tomorrow;
        document.getElementById('checkout').valueAsDate = checkout;
        
        // Determina l'URL dell'API (locale o produzione)
        const API_BASE = window.location.hostname === 'localhost' 
            ? 'http://localhost:5173/api'
            : '/api';
        
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const result = document.getElementById('result');
            
            // Disabilita il form
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loader"></span> Invio in corso...';
            result.classList.remove('show');
            
            // Prepara i dati
            const bookingData = {
                checkin: document.getElementById('checkin').value,
                checkout: document.getElementById('checkout').value,
                adults: parseInt(document.getElementById('adults').value),
                children: parseInt(document.getElementById('children').value),
                guests: parseInt(document.getElementById('adults').value) + parseInt(document.getElementById('children').value),
                customerName: document.getElementById('customerName').value,
                customerEmail: document.getElementById('customerEmail').value,
                customerPhone: document.getElementById('customerPhone').value,
                specialRequests: document.getElementById('specialRequests').value,
                totalPrice: 450.00 // Mock price
            };
            
            console.log('📤 Invio booking:', bookingData);
            
            try {
                const response = await fetch(`${API_BASE}/unified?action=booking`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bookingData)
                });
                
                const data = await response.json();
                console.log('📥 Risposta API:', data);
                
                if (data.success) {
                    result.className = 'result success show';
                    result.innerHTML = `
                        <strong>✅ Prenotazione creata con successo!</strong>
                        <pre>${JSON.stringify(data.booking, null, 2)}</pre>
                        <p style="margin-top: 10px;"><strong>Booking ID:</strong> ${data.booking.booking_id}</p>
                        <p><strong>Check Database:</strong> Verifica ora il pannello admin</p>
                    `;
                } else {
                    throw new Error(data.error || 'Errore sconosciuto');
                }
            } catch (error) {
                console.error('❌ Errore:', error);
                result.className = 'result error show';
                result.innerHTML = `
                    <strong>❌ Errore invio prenotazione</strong>
                    <p>${error.message}</p>
                    <pre>${error.stack || 'Nessun dettaglio disponibile'}</pre>
                `;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Invia Prenotazione Test';
            }
        });
    </script>
</body>
</html>
