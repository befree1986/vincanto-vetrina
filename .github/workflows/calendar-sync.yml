name: Sync Calendari Automatico

on:
  schedule:
    - cron: '*/5 * * * *' # ogni 5 minuti (UTC)
  workflow_dispatch: # permette di lanciare manualmente

jobs:
  sync-calendars:
    runs-on: ubuntu-latest
    steps:
      - name: Chiamata endpoint di sync calendari (DEV)
        run: |
          # In produzione sostituire con https://vincantomaori.it/api/calendar-real-sync
          curl -X POST "https://vincanto-vetrina.vercel.app/api/calendar-real-sync"
