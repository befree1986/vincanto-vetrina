name: Sync Calendari Automatico

on:
  schedule:
    - cron: '*/30 * * * *' # ogni 30 minuti (UTC) - frequenza ottimizzata
  workflow_dispatch: # permette di lanciare manualmente

jobs:
  sync-calendars:
    runs-on: ubuntu-latest
    env:
      AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
      BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
      HOLIDU_ICAL_URL: ${{ secrets.HOLIDU_ICAL_URL }}
      CALENDAR_SYNC_TOKEN: ${{ secrets.CALENDAR_SYNC_TOKEN }}
    
    steps:
      - name: 🔄 Sincronizzazione Calendari Esterni
        id: sync
        if: env.CALENDAR_SYNC_TOKEN != ''
        run: |
          echo "🚀 Avvio sincronizzazione calendari $(date '+%Y-%m-%d %H:%M:%S UTC')"
          
          # Endpoint Vercel
          SYNC_URL="https://vincantomaiori.it/api/calendar-real-sync"
          echo "📡 Chiamata a: $SYNC_URL"
          
          # Chiamata semplificata con verbose output
          HTTP_CODE=$(curl -X POST "$SYNC_URL" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-Calendar-Sync/1.0" \
            -H "X-Sync-Token: ${CALENDAR_SYNC_TOKEN}" \
            -w "%{http_code}" \
            -o response.json \
            -s)
          
          echo "📡 HTTP Status: $HTTP_CODE"
          
          if [ -f response.json ]; then
            echo "📦 Response Body:"
            cat response.json
            echo ""
          fi
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Sincronizzazione completata con successo"
            
            # Parsing risposta JSON per statistiche (se disponibile)
            if command -v jq &> /dev/null && [ -f response.json ]; then
              jq -r '.result[]? | "  - \(.name): \(.eventsFound) eventi trovati, \(.eventsUpdated) salvati"' response.json 2>/dev/null || true
            fi
            
            exit 0
          else
            echo "❌ Errore sincronizzazione (HTTP $HTTP_CODE)"
            [ -f response.json ] && cat response.json
            exit 1
          fi
      
      - name: 📊 Verifica Status Calendari
        if: success()
        run: |
          echo "✅ Sincronizzazione riuscita alle $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "📅 Prossimo sync programmato tra 30 minuti"
      
      - name: 🚨 Notifica Errore Sincronizzazione
        if: failure()
        run: |
          echo "::error::❌ Sincronizzazione calendari fallita!"
          echo "::warning::Verificare configurazione secrets e endpoint API"
